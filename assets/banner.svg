<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #a5b4fc; }
    
    /* Dynamic background animations */
    @keyframes float1 { 0% { transform: translate(0px, 0px); } 50% { transform: translate(-15px, 20px); } 100% { transform: translate(0px, 0px); } }
    @keyframes float2 { 0% { transform: translate(0px, 0px); } 50% { transform: translate(20px, -15px); } 100% { transform: translate(0px, 0px); } }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }
    @keyframes dash { to { stroke-dashoffset: -40; } }

    .bg-node-1 { animation: float1 8s ease-in-out infinite; }
    .bg-node-2 { animation: float2 10s ease-in-out infinite; }
    .pulse-elem { animation: pulse 4s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Background Visual Elements (Behind Text) -->
  <g class="bg-node-1" opacity="0.4">
    <circle cx="950" cy="100" r="140" fill="#6366f1" filter="blur(50px)"/>
    <rect x="820" y="80" width="280" height="160" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Simulated Chart Line -->
    <path d="M 840 200 L 890 170 L 940 185 L 990 130 L 1040 140 L 1080 100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1080" cy="100" r="6" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <g class="bg-node-2" opacity="0.3">
    <circle cx="200" cy="240" r="120" fill="#a855f7" filter="blur(60px)"/>
    <path class="flow-line" d="M 100 260 Q 250 180 400 260 T 700 200" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Decorative Pills/Badges in Background -->
  <g opacity="0.25" class="pulse-elem">
    <rect x="720" y="40" width="120" height="32" rx="16" fill="#6366f1"/>
    <rect x="1000" y="240" width="140" height="32" rx="16" fill="#ec4899"/>
    <rect x="60" y="40" width="160" height="32" rx="16" fill="#38bdf8"/>
  </g>

  <!-- Foreground Main Content Container (Guaranteed Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <rect x="0" y="55" width="220" height="30" rx="15" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="15" y="75" class="badge-text">⚡ DEBT RECOVERY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Debt Collection Platform 💎</text>

    <!-- Gradient Divider Bar -->
    <rect x="0" y="160" width="480" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle / Description -->
    <text x="0" y="205" class="subtitle">Curated SaaS Platforms, Enterprise ARM Software &amp; Open-Source Projects</text>
    <text x="0" y="235" class="subtitle" font-size="16px" fill="#94a3b8">Automated Workflows • Compliance Management • AI Recovery Optimization • Payment Portals</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 262)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12px" fill="#cbd5e1" font-weight="600">📊 SaaS Metrics</text>

      <rect x="120" y="0" width="140" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="132" y="17" font-family="sans-serif" font-size="12px" fill="#cbd5e1" font-weight="600">⭐ Star-Ranked OS</text>

      <rect x="270" y="0" width="130" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="282" y="17" font-family="sans-serif" font-size="12px" fill="#cbd5e1" font-weight="600">🛡️ FDCPA / ARM</text>
    </g>
  </g>
</svg>
